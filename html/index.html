<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekler - WEEK</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="week.css">
</head>

<body>
<header>
    <button class="mon next">MON</button>
    <button class="week active">WEEK</button>
    <button class="todo">TODO</button>
</header>

<main>
    <section id="week-header">
        <button>&lt;</button>
        <h2>2026 8월 3주차</h2>
        <button>&gt;</button>
    </section>

    <section id="calendar">
        <article>
            <div>
                <h3>10</h3>
            </div>

            <div>
                <h3>MON</h3>
            </div>
        
            <div class="schedule-area">
                <ul>
                    <li>
                        <input type="checkbox">
                        <span>약속 일정 잡기& 향수 공방 예약하기</span>
                        <button>⋮</button>
                        <div class="delete-schedule">
                            <button>일정 삭제</button>
                        </div>
                    </li>
                </ul>
            </div>
        </article>

        <article>
            <div>
                <h3>11</h3>
            </div>

                    </li>
