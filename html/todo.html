<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekler - TODO</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="common2.css">
    <link rel="stylesheet" href="todo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <header>
        <button class="mon">MON</a>
        <button class="week">WEEK</a>
        <button class="todo active">TODO</a>
    </header>


    <main>
        <section class="category-list">
            <article class="category1">
                <div class="category-header">
                    <h3>todo</h3>
                    <div class="header-buttons">
                        <button class="plus">+</button>
                        <button class="menu">⋮</button>
                    </div>
                     <div class="schedule-edit">
                        <button>카테고리 삭제</button>
                        <button>일정 편집</button>
                     </div>
                </div> 

                <div class="category-content">
                    <ul>
                        <li>
                            <input type="checkbox">
                            <span>키링 갖다주기</span>
                        </li>
                    </ul>
                </div>
                
                <section class="edit-toolbar">
                    <button class="delete-button">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                    <button class="complete-button">
                        <i class="fa-solid fa-check"></i>
                    </button>
                </section>
            </article>

            <article class="category2">
                <div class="category-header">
                    <h3>학교생활</h3>
                    <div class="header-buttons">
                        <button class="plus">+</button>
                        <button class="menu">⋮</button>
                    </div>
                     <div class="schedule-edit">
                        <button>카테고리 삭제</button>
                        <button>일정 편집</button>
                     </div>
                </div>

                <div class="category-content">
                    <ul>
                        <li>
                            <input type="checkbox">
                            <span>등록금 내기</span>
                            <div class="date">8월 30일</div>
                        </li>
                    </ul>
                </div>
                
                <section class="edit-toolbar">
                    <button class="delete-button">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                    <button class="complete-button">
                        <i class="fa-solid fa-check"></i>
                    </button>
                </section>
            </article>

            <article class="category3">
                <div class="category-header">
                    <h3>약속</h3>

                    <div class="header-buttons">
                        <button class="plus">+</button>
                        <button class="menu">⋮</button>
                    </div>

                     <div class="schedule-edit">
                        <button>카테고리 삭제</button>
                        <button>일정 편집</button>
                     </div>
                </div>
                
                <div class="category-content">
                    <ul>
                    </ul>
                </div>

                <section class="edit-toolbar">
                    <button class="delete-button">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                    <button class="complete-button">
                        <i class="fa-solid fa-check"></i>
                    </button>
                </section>
            </article>  

            <article class="categoryplus">
                <h3>카테고리 추가</h3>
                <button class="plusbutton">+</button>
            </article>
        </section>

        <section class="schedule-modal">
            <div class="schedule-button">
                <button class="save-button">✓</button>
                <button class="close-button">X</button>
            </div>
            <div class="schedule-title">
                <input type="text" placeholder="제목">
            </div>

            <div class="schedule-time">
                <input type="time">
            </div>
        </section>

        <section class="categoryname-modal">
            <div>
                <h3>카테고리 이름을 정해주세요</h3>
            </div>

            <div>
                <input type="text" class="name" placeholder="카테고리 이름">
            </div>
        </section>

        <section class="categorydelete-modal">
            <div>
                <h3>카테고리를 삭제하시겠습니까?</h3>
                <div class="categorydelete-buttons">
                    <button class="yes">네</button>
                    <button class="no">아니오</button>
                </div>
            </div>
         </section>
         <script src="script.js"></script>
    </main>
</body>
</html>
