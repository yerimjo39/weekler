<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekler - MONTH</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="common2.css">
    <link rel="stylesheet" href="month.css">
</head>

<body>
<!-- 헤더 버튼 -->
<header>
    <button class="mon active">MON</a>
    <button class="week next">WEEK</a>
    <button class="todo">TODO</a>
</header>

<main>
    <div class="calendar-wrapper">
        <!-- 연 월 표시 -->
        <div class="header">
            <section id="year-header">
                <div class="year">
                    <h2 id="current-year">2026</h2>  
                </div>
            </section>

            <section id="month-header">
                <button class="prev-btn">&lt;</button>

                <div class="month">
                    <h2 id="current-month">8</h2>
                </div>

                <button class="next-btn">&gt;</button>
            </section>
        </div>
        
        <!-- 이미지 -->
        <div class="body">
            <section id="image">
                <img src="images/the_iop-coast-9549731.png" alt="the_iop-coast-9549731">
            </section>
        </div>
    </div>
    
    <section id="calendar">

        <table>
            <!-- 요일 칸 -->
            <thead>
                <tr>
                    <th>월</th>
                    <th>화</th>
                    <th>수</th>
                    <th>목</th>
                    <th>금</th>
                    <th>토</th>
                    <th>일</th>
                </tr>
            </thead>
            <!-- 날짜 칸 -->
            <tbody id="calendar-body"></tbody>
        </table>
    </section>

    <!-- 일정 추가 팝업 -->
    <section class="schedule-modal">
        <div class="schedule-button">
            <button class="save-button">✓</button>
            <button class="close-button">X</button>
        </div>
        <div class="schedule-title">
            <input type="text" placeholder="제목">
        </div>

        <div class="schedule-time">
            <input type="time">
        </div>
    </section>
    <script src="script.js"></script>
</main>
</body>
</html>
